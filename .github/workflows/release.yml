name: Release

# Dois destinos:
#   - `workflow_dispatch` com target=testpypi → ensaio em test.pypi.org
#   - tag `vX.Y.Z`                            → PyPI real + GitHub release
#
# Autenticação por Trusted Publishing (OIDC): não há token no repositório.
# Configurar **antes da primeira corrida**, em cada índice:
#   https://pypi.org/manage/account/publishing/
#   https://test.pypi.org/manage/account/publishing/
# com: owner=maikramer, repo=vramd, workflow=release.yml
# (o nome do ficheiro entra na verificação: .yml e .yaml são strings
#  diferentes para o PyPI, e a correspondência é exacta).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: Índice de destino
        type: choice
        options: [testpypi, pypi]
        default: testpypi

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build sdist + wheel
        run: |
          pip install build twine
          python -m build
          twine check dist/*
      - name: Version matches the tag
        # Uma tag v0.2.0 com pyproject em 0.1.0 publicaria a versão errada — e
        # no PyPI isso não se corrige, só se abandona.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(ls dist/*.tar.gz | sed -E 's/.*vramd-(.*)\.tar\.gz/\1/')
          echo "tag=$tag  pacote=$pkg"
          [ "$tag" = "$pkg" ] || { echo "::error::tag $tag != versão $pkg"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  testpypi:
    name: publish to TestPyPI
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/vramd
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    name: publish to PyPI
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/vramd
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: GitHub release
    needs: pypi
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --generate-notes
