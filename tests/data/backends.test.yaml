# Fixture dos testes: registry realista com 10 backends, footprints e perfis de
# pico. Não é o que o vramd envia — o `data/backends.yaml` empacotado é um
# exemplo genérico. Aqui usam-se nomes e pegadas de um caso real (a origem do
# projeto) porque os testes verificam matemática de admit contra números que
# foram medidos em hardware.
version: 2
backends:
  - name: text2icon
    adapter: tests.fake_adapter
    vram_mib: 3000
    footprint_key: sana-sprint-600m
    priority: 20
    tool: text2icon

  - name: texture2d
    adapter: tests.fake_adapter
    vram_mib: 2500
    priority: 20
    tool: texture2d

  - name: text2d
    adapter: tests.fake_adapter
    vram_mib: 4500
    footprint_key: flux-klein-9b
    priority: 25
    tool: text2d
    peak_profile:
      memory_efficient_with_quant: true
      streams_on_load_with_memory_efficient: true

  - name: skymap2d
    adapter: tests.fake_adapter
    vram_mib: 7000
    footprint_key: flux-dev-uint4
    priority: 25
    tool: skymap2d

  - name: text3d
    adapter: tests.fake_adapter
    vram_mib: 10000
    footprint_key: hunyuan3d-omni
    priority: 40
    tool: text3d
    peak_profile:
      memory_efficient_with_quant: true
      group_offload_with_memory_efficient: true

  - name: paint3d
    adapter: tests.fake_adapter
    vram_mib: 4000
    footprint_key: hunyuan-paint
    priority: 40
    tool: paint3d
    peak_profile:
      memory_efficient_with_quant: true

  - name: part3d
    adapter: tests.fake_adapter
    vram_mib: 5200
    footprint_key: hunyuan3d-part
    priority: 35
    tool: part3d

  - name: text2sound
    adapter: tests.fake_adapter
    vram_mib: 5000
    footprint_key: stable-audio-open
    priority: 30
    tool: text2sound

  - name: terrain3d
    adapter: tests.fake_adapter
    # Medido: pesos fp32 reais ~1.1 GiB (coarse 11M + base 968M + decoder 107M)
    # + activações (tiles 512², warmup bs<=16) ~0.7 GiB + contexto CUDA.
    # 6000 era ~2x conservador e recusava GPUs de 6 GB (peak 6384 > 5627 livre).
    vram_mib: 3200
    priority: 40
    tool: terrain3d

  - name: motion3d
    adapter: tests.fake_adapter
    # HY-Motion staged (DiT GPU + text CPU): admit via footprint hy-motion-* + peak opts.
    # YAML fallback ~ Full DiT fp16 + act (~4 GiB); hw-auto injecta sdnq/offload.
    vram_mib: 4500
    footprint_key: hy-motion-lite
    priority: 30
    tool: motion3d
    peak_profile:
      memory_efficient_with_quant: true
      group_offload_with_memory_efficient: true
