name: Feature
description: Propose a behavior change
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem it solves
      description: The concrete problem, not the solution. A real case helps a lot.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
