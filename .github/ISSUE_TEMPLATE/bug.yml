name: Bug
description: Something doesn't work as described
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        If the issue is VRAM/admission related, `vramd doctor` and
        `vramd status --json` answer half the questions below.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: And what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      placeholder: |
        1. vramd start
        2. vramd submit my-model ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: '`vramd doctor` output'
      render: shell
  - type: input
    id: gpu
    attributes:
      label: GPU and driver
      placeholder: "RTX 4050 Laptop 6 GB, driver 595.84"
  - type: input
    id: version
    attributes:
      label: vramd and Python versions
      placeholder: "vramd 0.1.0, Python 3.13"
    validations:
      required: true
