name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install ruff
        # Exact version: `format --check` diverges between ruff versions, and a
        # CI that disagrees with the local formatter is permanent noise.
        run: pip install ruff==0.16.2
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        run: ruff format --check .

  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Tests
        # The suite is CPU-only on purpose: the supervisor doesn't import torch
        # and the workers are stand-ins. A GPU-less runner runs everything.
        run: pytest -q --tb=short

  package:
    name: package (build + metadata)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build
        run: |
          pip install build twine
          python -m build
      - name: Validate metadata
        run: twine check dist/*
      - name: Install from wheel and smoke-test the CLI
        # Catches the case where the suite passes but the installed package
        # doesn't run (missing package-data, broken entry point).
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install -q dist/*.whl
          /tmp/smoke/bin/vramd --version
          /tmp/smoke/bin/vramd backends
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
