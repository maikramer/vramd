name: Release

# Two targets:
#   - `workflow_dispatch` with target=testpypi → rehearsal on test.pypi.org
#   - tag `vX.Y.Z`                            → real PyPI + GitHub release
#
# Authentication via Trusted Publishing (OIDC): no token in the repository.
# Configure **before the first run**, on each index:
#   https://pypi.org/manage/account/publishing/
#   https://test.pypi.org/manage/account/publishing/
# with: owner=maikramer, repo=vramd, workflow=release.yml
# (the file name matters in the check: .yml and .yaml are different strings
#  for PyPI, and the match is exact).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: Target index
        type: choice
        options: [testpypi, pypi]
        default: testpypi

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build sdist + wheel
        run: |
          pip install build twine
          python -m build
          twine check dist/*
      - name: Version matches the tag
        # A v0.2.0 tag with pyproject at 0.1.0 would publish the wrong version —
        # and on PyPI that can't be fixed, only abandoned.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(ls dist/*.tar.gz | sed -E 's/.*vramd-(.*)\.tar\.gz/\1/')
          echo "tag=$tag  package=$pkg"
          [ "$tag" = "$pkg" ] || { echo "::error::tag $tag != version $pkg"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  testpypi:
    name: publish to TestPyPI
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/vramd
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    name: publish to PyPI
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/vramd
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: GitHub release
    needs: pypi
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --generate-notes
